<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Naquiel - Conversor IPv6 ↔ Binario</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="monitor">
    <div class="pantalla">
      <div class="contenedor">
        <h1 class="app-name">Naquiel</h1>
        <h2>Conversor IPv6 ↔ Binario</h2>

        <select id="modo" onchange="cambiarModo()">
          <option value="ipv6-bin">IPv6 a Binario</option>
          <option value="bin-ipv6">Binario a IPv6</option>
        </select>

        <div id="ipv6-input">
          <input type="text" id="ipv6" placeholder="Ejemplo: 2001:CAFE:CAFE:1::">
        </div>

        <div id="binario-input" style="display: none;">
          <input type="text" id="binario" placeholder="Ingrese dirección binaria completa">
        </div>

        <input type="text" id="mascara" placeholder="Máscara (ej: /64) opcional">

        <button onclick="convertir()">Convertir</button>

        <pre id="resultado"></pre>
        <button id="btnCopiar" onclick="copiarResultado()">Copiar</button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
